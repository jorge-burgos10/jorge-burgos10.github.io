<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found · Jorge Burgos</title>

  <meta name="theme-color" content="#0d1117" />
  <!-- Root-relative paths: GitHub Pages serves this page at any missing URL -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #0d1117;
      --border: #232b36;
      --text: #e2e8f0;
      --text-muted: #94a3b3;
      --accent: #56b6c2;
      --accent-dim: rgba(86, 182, 194, 0.12);
      --font-mono: "JetBrains Mono", monospace;
      --font-body: "Inter", system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .nav {
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
    }

    .nav-inner img {
      display: block;
      height: 1.75rem;
      width: auto;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 6rem 1.5rem;
      position: relative;
    }

    /* Same faint map grid as the portfolio hero */
    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: 0.45;
      -webkit-mask-image: radial-gradient(ellipse 60% 70% at 30% 35%, #000 0%, transparent 78%);
      mask-image: radial-gradient(ellipse 60% 70% at 30% 35%, #000 0%, transparent 78%);
    }

    .kicker {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 6vw, 2.8rem);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    /* Blinking cursor, as on the portfolio */
    .cursor {
      position: relative;
      animation: blink 0.85s step-end infinite;
    }

    .cursor::after {
      content: "";
      position: absolute;
      left: 1px;
      top: 0;
      bottom: 0;
      width: 0.12em;
      background: var(--accent);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    p {
      color: var(--text-muted);
      max-width: 34rem;
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      transition: background 0.2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--accent-dim);
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" aria-label="Jorge Burgos — home"><img src="/images/logo.svg" alt="" width="28" height="28" /></a>
    </div>
  </nav>

  <main>
    <p class="kicker">404</p>
    <h1>Page not found<span class="cursor" aria-hidden="true"></span></h1>
    <p>This page doesn’t exist or has moved.</p>
    <a class="btn" href="/">← back to jorgeburgos.me</a>
  </main>
</body>
</html>
