<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Campus-map cover art for the EV Charging Station project card:
       five charging stations around a campus loop. The title is drawn
       by the page (HTML) so it uses the site font. -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141b24" stroke-width="1"/>
    </pattern>
    <g id="bolt">
      <path d="M2.5 -10L-6 1.500H-0.500L-2.5 10L6 -1.500H0.500Z"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="#0d1117"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Campus buildings -->
  <g fill="#111822">
    <rect x="160" y="170" width="120" height="55" rx="3"/>
    <rect x="385" y="115" width="140" height="75" rx="3"/>
    <rect x="400" y="280" width="125" height="95" rx="3"/>
    <rect x="595" y="255" width="80" height="105" rx="3"/>
    <rect x="170" y="300" width="90" height="80" rx="3"/>
    <rect x="610" y="115" width="80" height="60" rx="3"/>
  </g>

  <!-- Inner streets -->
  <g fill="none" stroke="#1c242e" stroke-width="3" stroke-linecap="round">
    <path d="M330 90L360 448"/>
    <path d="M120 250L720 222"/>
    <path d="M560 82L560 440"/>
    <path d="M-20 60L128 190"/>
    <path d="M716 300L820 320"/>
  </g>

  <!-- Campus loop road -->
  <path d="M120 250Q130 90 330 90L600 80Q720 85 720 220L700 380Q690 440 560 440L260 450Q130 440 120 250Z" fill="none" stroke="#283340" stroke-width="7" stroke-linejoin="round"/>

  <!-- Charging stations -->
  <g>
    <circle cx="215" cy="135" r="16" fill="#0d1117" stroke="#56b6c2" stroke-width="2.5"/>
    <use href="#bolt" x="215" y="135" fill="#56b6c2"/>

    <circle cx="345" cy="240" r="16" fill="#0d1117" stroke="#56b6c2" stroke-width="2.5"/>
    <use href="#bolt" x="345" y="240" fill="#56b6c2"/>

    <circle cx="700" cy="380" r="16" fill="#0d1117" stroke="#56b6c2" stroke-width="2.5"/>
    <use href="#bolt" x="700" y="380" fill="#56b6c2"/>

    <circle cx="455" cy="415" r="16" fill="#0d1117" stroke="#56b6c2" stroke-width="2.5"/>
    <use href="#bolt" x="455" y="415" fill="#56b6c2"/>

    <!-- Station currently reserved -->
    <circle cx="560" cy="150" r="38" fill="#56b6c2" opacity="0.1"/>
    <circle cx="560" cy="150" r="27" fill="#56b6c2" opacity="0.2"/>
    <circle cx="560" cy="150" r="17" fill="#56b6c2" stroke="#0d1117" stroke-width="2"/>
    <use href="#bolt" x="560" y="150" fill="#0d1117"/>
  </g>
</svg>
